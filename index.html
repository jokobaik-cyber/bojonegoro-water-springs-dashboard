<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sumber Mata Air Bojonegoro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                primary: '#2563eb',
                secondary: '#0ea5e9',
              }
            },
            borderRadius: {
              '2xl': '1rem',
              '3xl': '1.5rem',
              '4xl': '2rem',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(226, 232, 240, 0.5);
        }

        .dark {
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(51, 65, 85, 0.5);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
            letter-spacing: -0.01em;
        }

        html {
            height: 100%;
            width: 100%;
        }

        #root {
            height: 100%;
            width: 100%;
        }

        .map-container {
            width: 100% !important;
            height: 100% !important;
            display: flex !important;
            flex: 1;
            position: relative;
            background: #f1f5f9;
        }

        .leaflet-container {
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
            background: #f1f5f9;
            z-index: 1;
            flex: 1 !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
        }

        .dark .leaflet-container {
            background: #1e293b;
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(85%);
        }
        
        .leaflet-tile-pane {
            z-index: 2;
        }
        
        .leaflet-pane, .leaflet-pane > svg, .leaflet-pane > canvas {
            position: absolute;
            display: block;
            left: 0;
            top: 0;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -8px rgba(37, 99, 235, 0.15);
            border-color: rgba(37, 99, 235, 0.2);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 1rem !important;
            padding: 0 !important;
            overflow: hidden;
        }
        
        .dark .leaflet-popup-content-wrapper {
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
        }

        .leaflet-popup-content {
            margin: 0 !important;
        }
        .leaflet-popup-tip {
            background: white !important;
        }
        .dark .leaflet-popup-tip {
            background: #0f172a !important;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "leaflet": "https://esm.sh/leaflet@^1.9.4",
    "react-leaflet": "https://esm.sh/react-leaflet@^5.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 selection:bg-blue-600 selection:text-white overflow-hidden">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
